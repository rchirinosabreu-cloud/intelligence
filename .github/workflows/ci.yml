name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      # The shared cluster serves the general suites. Chat suites refuse anything that is
      # not 127.0.0.1:55448/recognition_test with user recognition_test, and the
      # generic suites accept any local database, so this shape satisfies both.
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: recognition_test
          POSTGRES_DB: recognition_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55448:5432
        # Wait for postgres to be ready
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      governance-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: governance_test
          POSTGRES_DB: governance_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55449:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Always 127.0.0.1, never localhost: the chat sandbox compares the
      # hostname literally, and localhost can resolve to ::1 first.
      DATABASE_URL: postgresql://recognition_test@127.0.0.1:55448/recognition_test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Prisma Generate
        run: npx prisma generate

      - name: Enable pgvector
        run: psql -h 127.0.0.1 -p 55448 -U recognition_test -d recognition_test -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Provision Test Schema
        run: npx prisma db push

      # The component suites build their bundles under output/, which is
      # gitignored and therefore absent from a clean checkout.
      - name: Prepare scratch directories
        run: mkdir -p output

      - name: Lint Code
        run: npm run lint

      - name: Verify Build
        run: npm run build

      - name: Run Tests
        env:
          TEST_DATABASE_URL: postgresql://recognition_test@127.0.0.1:55448/recognition_test
          JWT_SECRET: test-secret-with-at-least-32-characters
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run test:ci

      - name: Verify AI governance persistence and egress
        env:
          TEST_DATABASE_URL: postgresql://governance_test@127.0.0.1:55449/governance_test
        run: node --test tests/aiGovernancePostgres.integration.mjs
